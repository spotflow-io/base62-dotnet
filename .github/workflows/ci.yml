name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
      publish-nuget-org: ${{ startsWith(github.ref, 'refs/tags/v') }}
      publish-github: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'publish-artifacts') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install GitVersion
        run: |
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet tool install --global GitVersion.Tool --version 6.5.0 --ignore-failed-sources
      - name: Resolve version
        id: resolve-version
        shell: pwsh
        run: |
          $version = (dotnet-gitversion | ConvertFrom-Json).SemVer
          "version=$version" >> $env:GITHUB_OUTPUT
          "Version = $version" >> $env:GITHUB_STEP_SUMMARY

  build:
    runs-on: ubuntu-latest
    needs: init
    env:
      CI: true
      Configuration: Release
      Version: ${{ needs.init.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x.x
            9.x.x
            10.x.x
      - name: Restore
        run: dotnet restore
      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --no-restore
      - name: Pack
        run: dotnet pack --no-build --no-restore --output nugets
      - name: Validate packages
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-validate --version 0.0.1-preview.537 --ignore-failed-sources
          Get-ChildItem ./nugets -Filter '*.nupkg' | ForEach-Object { & "$HOME/.dotnet/tools/dotnet-validate" package local $_ }
      - name: Upload packages
        if: ${{ needs.init.outputs.publish-nuget-org == 'true' || needs.init.outputs.publish-github == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: nugets
          path: nugets

  publish-nuget-org:
    runs-on: ubuntu-latest
    needs: [init, build]
    if: ${{ needs.init.outputs.publish-nuget-org == 'true' }}
    environment: nuget-org
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nugets
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: Publish to NuGet.org
        run: dotnet nuget push '*.nupkg' --api-key '${{ steps.login.outputs.NUGET_API_KEY }}' --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-github:
    runs-on: ubuntu-latest
    needs: [init, build]
    if: ${{ needs.init.outputs.publish-github == 'true' }}
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nugets
      - name: Publish to GitHub Packages
        run: dotnet nuget push '*.nupkg' --api-key '${{ secrets.GITHUB_TOKEN }}' --source https://nuget.pkg.github.com/spotflow-io/index.json --skip-duplicate --no-symbols
